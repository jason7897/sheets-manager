    `<div><span class="num">${i+1}.</span>${s.title}${s.link!=='#' ? ' 🔗' : ''}</div>`
  ).join('');

async function upload() {
  const btn    = document.getElementById('btn');
  const result = document.getElementById('result');
  const payload = { sheetsData, treeData, nextId:29, currentFilter:'all', currentView:'grid', currentSort:'pinned', searchQuery:'', recentIds:[], updatedAt:Date.now() };

  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span>GAS에 업로드 중...';
  result.style.display = 'none';

  try {
    const res  = await fetch(GAS_URL, {
      method:  'POST',
      headers: { 'Content-Type':'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(JSON.stringify(payload))
    });
    const json = await res.json();
    if (json.ok) {
      result.className = 'result ok';
      result.innerHTML = '✅ 복구 완료! 28개 업로드 성공<br><a href="https://spread-sheet-manager.vercel.app" target="_blank">spread-sheet-manager.vercel.app</a> 에서 확인하세요.';
    } else {
      throw new Error(json.error || 'GAS 오류');
    }
  } catch(e) {
    result.className = 'result err';
    result.innerHTML = '❌ 실패: ' + e.message;
  } finally {
    btn.disabled  = false;
    btn.innerHTML = 'GAS에 복구 데이터 업로드하기';
    result.style.display = 'block';
  }
